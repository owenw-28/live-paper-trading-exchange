name: paper-exchange

x-app: &app
  image: paper-exchange-app
  pull_policy: never # built locally by the init service
  profiles: [app]
  restart: unless-stopped
  environment:
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
    DJANGO_DEBUG: "false"
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ARCHIVE_ROOT: /data/archive
    OTEL_ENABLED: "true"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4318
    OTEL_METRIC_EXPORT_INTERVAL: "10000"
    OTEL_SEMCONV_STABILITY_OPT_IN: http
  depends_on:
    init:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  postgres:
    image: timescale/timescaledb-ha:pg17.11-ts2.30.2
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exchange}
      POSTGRES_USER: ${POSTGRES_USER:-exchange}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.2.10
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.5
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.12.0
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy
  
  observability:
    image: grafana/otel-lgtm:0.37.0
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP over gRPC
      - "4318:4318"   # OTLP over HTTP
    volumes:
      - ./observability/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./observability/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/paper-exchange.yaml:ro
      - ./observability/dashboards:/otel-lgtm/dashboards/paper-exchange:ro

  redpanda-config:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.5
    profiles: [app]
    entrypoint: ["sh", "-c"]
    command:
      - >-
        rpk cluster config set enable_consumer_group_metrics '["group","partition","consumer_lag"]' -X admin.hosts=redpanda:9644 &&
        rpk cluster config set consumer_group_lag_collection_interval_sec 10 -X admin.hosts=redpanda:9644
    depends_on:
      redpanda:
        condition: service_healthy

  init:
    <<: *app
    build: .
    pull_policy: build
    restart: "no"
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py create_topics"]
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-config:
        condition: service_completed_successfully

  web:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingestor:
    <<: *app
    command: ["python", "manage.py", "run_ingestor"]

  archiver:
    <<: *app
    command: ["python", "manage.py", "run_archiver"]
    volumes:
      - archive-data:/data/archive

  fanout:
    <<: *app
    command: ["python", "manage.py", "run_fanout"]
  
  relay:
    <<: *app
    command: ["python", "manage.py", "run_relay"]

  engine:
    <<: *app
    command: ["python", "manage.py", "run_engine"]

  settlement:
    <<: *app
    command: ["python", "manage.py", "run_settlement"]

  caddy:
    build: ./frontend
    image: paper-exchange-frontend
    profiles: [app]
    ports:
      - "${APP_PORT:-8081}:80"
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  redpanda-data:
  archive-data:
