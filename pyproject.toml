[project]
name = "paper-exchange"
version = "0.1.0"
description = "Live paper-trading exchange on real market data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "confluent-kafka>=2.16.0",
    "django>=5.2,<5.3",
    "djangorestframework>=3.18.3",
    "environs[django]>=15.2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-django[asgi]>=0.66b1",
    "opentelemetry-instrumentation-logging>=0.66b1",
    "opentelemetry-instrumentation-psycopg>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "psycopg[binary,pool]>=3.3.6",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "daphne>=4.2.3",
    "django-stubs[compatible-mypy]>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "fakeredis>=2.40.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
    "types-channels>=4.3.0.20260518",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.mypy]
python_version = "3.12"
files = ["apps", "config", "scripts", "conftest.py"]
check_untyped_defs = true
warn_unused_ignores = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"

[[tool.mypy.overrides]]
module = "config.settings"
disable_error_code = ["var-annotated"]
