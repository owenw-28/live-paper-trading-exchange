[project]
name = "paper-exchange"
version = "0.1.0"
description = "Live paper-trading exchange on real market data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "environs[django]>=15.2.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
